[package]
name = "nobody"
version = "1.0.0"
description = "Luxury desktop music player with live synchronized lyrics and dynamic cover theming"
authors = ["EPODONIOS"]
license = "MIT"
repository = ""
default-run = "nobody"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "nobody_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-shell = "2.3.5"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
tauri-plugin-http = "2.5.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
